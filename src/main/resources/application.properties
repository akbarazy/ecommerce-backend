# Server configuration
server.port=8080

# PostgreSQL Configuration
# Make sure you have created the "ecommerce_db" database in your local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Security (optional, to temporarily disable default login during development)
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT Configuration
# Secret key for signing the JWT token (min 256-bit / 32 character for HS256)
jwt.secret=Al2%Pc7*Oi3#Nm0@Ry5&Yq1$Xv4!Zg8~

# Valid token duration in miliseconds (1 hour = 3600000)
jwt.expiration=3600000